name: Build stable release

on:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      RELEASE_VERSION: v1.0.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build and check both Win32 DLLs
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "RELEASE_VS=%%i"
          call "%RELEASE_VS%\Common7\Tools\VsDevCmd.bat" -arch=x86 -host_arch=x64
          if errorlevel 1 exit /b 1
          pwsh -NoProfile -File tools\BuildRelease.ps1 -Version %RELEASE_VERSION%
      - name: Publish checked packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $env:RELEASE_VERSION --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw 'This release already exists; existing downloads will not be overwritten.' }
          $directory = "build/release/$env:RELEASE_VERSION"
          $files = @(
            (Join-Path $directory "RetroInput-The-Suffering-$env:RELEASE_VERSION-Win32.zip"),
            (Join-Path $directory "RetroInput-The-Suffering-Ties-That-Bind-$env:RELEASE_VERSION-Win32.zip"),
            (Join-Path $directory 'SHA256SUMS.txt')
          )
          foreach ($file in $files) { if (!(Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing release file: $file" } }
          gh release create $env:RELEASE_VERSION @files --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --title "RetroInput $env:RELEASE_VERSION - Controller artwork switching fix" --notes-file tools/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release creation or upload failed.' }
          gh release edit $env:RELEASE_VERSION --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
